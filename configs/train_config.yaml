# Single source of truth for tunable hyperparameters. Nothing here should
# be hard-coded in the Python modules.

model:
  model_id: "google/gemma-4-31b-it"   # verify exact id on the training host
  torch_dtype: "bfloat16"
  use_qlora: false
  train_vision_encoder: false
  train_projector: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  # LLM attention + MLP. Vision-tower targets are added automatically when
  # train_vision_encoder=true (names verified at load time, see load_model.py).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_jsonl: "data/train.jsonl"
  eval_jsonl: "data/val.jsonl"
  n_slices: 16
  total_slices: 144
  max_soft_tokens: 280
  cache_dir: "/scratch/slice_cache"
  cache_slices: true

training:
  output_dir: "./checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  eval_steps: 500
  seed: 42
  deepspeed: "./configs/ds_zero2.json"
  report_to: "wandb"
  dataloader_num_workers: 4

eval:
  max_new_tokens: 512
