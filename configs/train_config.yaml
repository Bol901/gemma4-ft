# Single source of truth for tunable hyperparameters. Nothing here should
# be hard-coded in the Python modules.

# Target hardware: 8x NVIDIA H200 141GB (Hopper, SM 9.0). 31B bf16 weights
# (~62GB) fit on a single H200, so ZeRO-2 (optimizer/grad sharding +
# data parallel) is sufficient -- no ZeRO-3/FSDP param sharding needed.
model:
  model_id: "google/gemma-4-31b-it"   # verify exact id on the training host
  torch_dtype: "bfloat16"
  use_qlora: false
  train_vision_encoder: false
  train_projector: true
  # Hopper: flash_attention_2 is the fastest. load_model falls back to
  # sdpa automatically if flash-attn isn't built on the host, so this is
  # safe to leave on.
  attn_implementation: "flash_attention_2"

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  # LLM attention + MLP. Vision-tower targets are added automatically when
  # train_vision_encoder=true (names verified at load time, see load_model.py).
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_jsonl: "data/train.jsonl"
  eval_jsonl: "data/val.jsonl"
  n_slices: 16
  total_slices: 144
  max_soft_tokens: 280
  cache_dir: "/scratch/slice_cache"
  cache_slices: true
  # Uncompressed npz: ~1.7MB/case (~19GB for 11k) but no per-item zlib
  # decode in the dataloader -> markedly faster training I/O. Set true
  # only if /scratch is tight.
  cache_compressed: false

training:
  output_dir: "./checkpoints"
  num_train_epochs: 3
  # 8 GPUs x bs 2 x accum 4 = effective batch 64 (same as the original
  # 4xA6000 plan, so LR/schedule stay valid). 141GB has ample headroom;
  # the host can raise per_device_train_batch_size and lower accum after
  # the dry run. gradient_checkpointing can likely be disabled on H200
  # for ~20-30% speedup once batch size is confirmed to fit.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  # Off by default: H200 141GB has headroom for 31B+LoRA, and disabling
  # checkpointing is ~20-30% faster. The dry run will OOM-fail fast if
  # this turns out too tight at the chosen batch size -> set true then.
  gradient_checkpointing: false
  # Liger fused RMSNorm/SwiGLU/cross-entropy kernels: big speed + memory
  # win for Gemma. train.py skips it gracefully if liger-kernel isn't
  # installed.
  use_liger_kernel: true
  # torch.compile: opt-in. Can be 1.2-2x but multimodal variable shapes
  # may cause recompiles; validate on the host before enabling for a
  # full run.
  torch_compile: false
  learning_rate: 1.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  eval_steps: 500
  seed: 42
  deepspeed: "./configs/ds_zero2.json"
  report_to: "wandb"
  # Dataloader: each __getitem__ runs the processor (chat template +
  # tokenize) on CPU, so keep workers high and pipeline deep to hide it
  # behind the GPU step.
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  dataloader_prefetch_factor: 4

eval:
  max_new_tokens: 512
